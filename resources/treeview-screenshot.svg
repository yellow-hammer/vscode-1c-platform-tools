<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="900" height="500" fill="#1f1f1f"/>

  <!-- строка заголовка -->
  <rect x="0" y="0" width="900" height="34" fill="#181818"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5" fill="#febc2e"/>
  <circle cx="56" cy="17" r="5" fill="#28c840"/>
  <text x="450" y="21" text-anchor="middle" fill="#8b8b8b" font-size="12">ssl_3_1 — Visual Studio Code</text>

  <!-- боковая панель: дерево команд -->
  <rect x="0" y="34" width="330" height="440" fill="#252526"/>
  <text x="20" y="58" fill="#cccccc" font-size="11" letter-spacing="0.8">ИНСТРУМЕНТЫ 1С</text>

  <g font-size="13">
    <text x="20" y="88" fill="#cccccc">📦 Информационная база</text>
    <text x="20" y="114" fill="#cccccc">📁 Конфигурация</text>

    <text x="20" y="140" fill="#ffffff" font-weight="600">🧩 Расширения</text>
    <g fill="#cccccc" font-size="12.5">
      <text x="40" y="164">📥 Загрузить из src/cfe</text>
      <text x="40" y="188">📥 Загрузить тестовые из tests/cfe</text>
      <text x="40" y="212">📤 Выгрузить в src/cfe</text>
      <text x="40" y="236">🔨 Собрать *.cfe из src/cfe</text>
    </g>

    <text x="20" y="266" fill="#cccccc">🗂️ Внешние файлы</text>
    <text x="20" y="292" fill="#ffffff" font-weight="600">⚡ Автоматизация</text>
    <g fill="#cccccc" font-size="12.5">
      <text x="40" y="316">🔗 Редактор пайплайнов</text>
      <text x="40" y="340">🪝 Редактор хуков</text>
    </g>
    <text x="20" y="370" fill="#cccccc">🧪 Тестирование</text>
    <text x="20" y="396" fill="#cccccc">🐞 Отладка</text>
    <text x="20" y="422" fill="#cccccc">🤖 Навыки для AI</text>
  </g>

  <!-- редактор: дерево метаданных -->
  <rect x="330" y="34" width="290" height="440" fill="#1f1f1f"/>
  <rect x="330" y="34" width="290" height="30" fill="#252526"/>
  <text x="346" y="54" fill="#cccccc" font-size="11" letter-spacing="0.8">ДЕРЕВО МЕТАДАННЫХ</text>
  <text x="588" y="54" fill="#8b8b8b" font-size="13">＋</text>

  <g font-size="13" fill="#cccccc">
    <text x="346" y="88">📂 Основная конфигурация</text>
    <text x="364" y="114">📗 Справочники</text>
    <text x="382" y="138" fill="#9cdcfe">Валюты</text>
    <text x="382" y="162" fill="#9cdcfe">Организации</text>
    <text x="364" y="188">📘 Документы</text>
    <text x="382" y="212" fill="#9cdcfe">ЗаказКлиента</text>
    <text x="364" y="238">📙 Регистры сведений</text>
    <text x="346" y="270">🧩 _ДемоРасширение</text>
    <text x="346" y="296">🧩 Тесты</text>
  </g>

  <path d="M346 320 h258" stroke="#3c3c3c"/>
  <text x="346" y="342" fill="#8b8b8b" font-size="11" letter-spacing="0.8">ПРОБЛЕМЫ</text>
  <g font-size="12">
    <text x="346" y="366" fill="#f14c4c">✕</text>
    <text x="366" y="366" fill="#cccccc">объект объявлен, файла нет</text>
    <text x="346" y="388" fill="#cca700">⚠</text>
    <text x="366" y="388" fill="#cccccc">файл есть, в составе не объявлен</text>
  </g>

  <!-- терминал -->
  <rect x="620" y="34" width="280" height="440" fill="#181818"/>
  <rect x="620" y="34" width="280" height="30" fill="#252526"/>
  <text x="636" y="54" fill="#cccccc" font-size="11" letter-spacing="0.8">ВЫВОД</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="11">
    <text x="636" y="86" fill="#89d185">vrunner init-dev</text>
    <text x="636" y="106" fill="#8b8b8b">Создание ИБ… готово</text>
    <text x="636" y="132" fill="#89d185">vrunner compile --src src/cf</text>
    <text x="636" y="152" fill="#8b8b8b">Загрузка конфигурации…</text>
    <text x="636" y="172" fill="#8b8b8b">успешно завершена</text>
    <text x="636" y="198" fill="#89d185">vrunner compileext tests/cfe</text>
    <text x="636" y="218" fill="#8b8b8b">YAXUNIT — загружено</text>
    <text x="636" y="238" fill="#8b8b8b">Тесты — загружено</text>
    <text x="636" y="264" fill="#89d185">vrunner xunit</text>
    <text x="636" y="284" fill="#8b8b8b">Тестов: 128, упало: 0</text>
    <text x="636" y="316" fill="#3794ff">Шаг 4. Тесты YAxUnit: выполнен</text>
    <text x="636" y="336" fill="#8b8b8b">за 42 300 мс</text>
  </g>

  <!-- статусная строка -->
  <rect x="0" y="474" width="900" height="26" fill="#3794ff"/>
  <text x="16" y="491" fill="#ffffff" font-size="11">main*</text>
  <text x="86" y="491" fill="#ffffff" font-size="11">📋 По умолчанию</text>
  <text x="212" y="491" fill="#ffffff" font-size="11">🖥️ Сервер 1С</text>
  <text x="318" y="491" fill="#ffffff" font-size="11">📁 ssl_3_1</text>
  <text x="884" y="491" text-anchor="end" fill="#ffffff" font-size="11">1C: Platform Tools</text>
</svg>
