<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Схема компоновки данных</title>
	<link rel="stylesheet" href="{{BASE_CSS_URI}}">
	<link rel="stylesheet" href="{{CSS_URI}}">
</head>
<body>
	<div class="page" id="page">
		<header class="page-header">
			<div class="header-main">
				<div class="kind-badge">Схема компоновки данных</div>
				<h1 class="title">{{TITLE}}</h1>
			</div>
			<button type="button" class="ghost-btn" id="validateBtn">Проверить схему</button>
		</header>
		<nav id="tabs" class="tabs"></nav>
		<!-- Живая область — обёртка, а не сама плашка: скрытая плашка (display: none) выпадает из дерева доступности, и её показ диктор не озвучил бы -->
		<div id="noticeLive" role="status" aria-live="polite"><div id="notice" class="dcs-notice hidden"></div></div>
		<section class="content" id="content"></section>
		<footer class="save-bar" id="saveBar">
			<span id="status" class="save-status"></span>
		</footer>
	</div>
	<!-- Уровень 1 стека диалогов; вложенные уровни скрипт собирает по этому же образцу -->
	<div id="dialogBackdrop" class="dcs-dialog-backdrop hidden">
		<div class="dcs-dialog" id="dialogBox" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">
			<div class="dcs-dialog-title" id="dialogTitle"></div>
			<div class="dcs-dialog-body" id="dialogBody"></div>
			<div class="dcs-dialog-error" id="dialogError" aria-live="polite"></div>
			<div class="dcs-dialog-actions" id="dialogActions">
				<button type="button" class="primary-btn" id="dialogOk">Сохранить</button>
				<button type="button" class="ghost-btn" id="dialogCancel">Отмена</button>
			</div>
		</div>
	</div>
	<script nonce="{{NONCE}}">
		window.__INITIAL_DATA__ = {{INITIAL_JSON}};
	</script>
	<script nonce="{{NONCE}}" src="{{HIGHLIGHT_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{DIALOGS_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{COMPLETE_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{TYPES_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{SETTINGS_WIZARD_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{QUERY_MODEL_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{QUERY_EDIT_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{FIELD_TYPES_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{FORMAT_JS_URI}}"></script>
	<!-- Закладки только задают фабрики: основной скрипт создаёт их в конце запуска и отдаёт объект ядра -->
	<script nonce="{{NONCE}}" src="{{SCHEMA_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{SETTINGS_PANELS_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{SETTINGS_JS_URI}}"></script>
	<script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
	<!-- Многостраничный конструктор запроса: видит редактор только через window.DcsEditorApi -->
	<script nonce="{{NONCE}}" src="{{QUERY_DIALOG_JS_URI}}"></script>
</body>
</html>
