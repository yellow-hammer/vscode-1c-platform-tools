# Проверка команд OData на настоящей платформе 1С.
#
# Задача идёт в образе клиента 1С из yellow-hammer/1c-nest. ibcmd создаёт файловую
# базу из тестовой конфигурации, ibsrv публикует стандартный интерфейс OData и
# HTTP-сервис с серверным кодом служебной обработки состава. Лицензия для этого
# не нужна.
#
# Отдельными шагами без влияния на итог пробуются сборка служебной обработки
# конфигуратором и её запуск тонким клиентом: им может понадобиться лицензия.
name: Проверка OData на платформе

on:
  workflow_dispatch:
    inputs:
      platform_version:
        description: 'Платформа: тег образа yellow-hammer/1c-nest, линейка ("8.3.27") или сборка ("8.3.27.2342")'
        required: false
        default: '8.3.27'
  push:
    branches:
      - 'feat/479-odata'
    paths:
      - '.github/workflows/platform-odata.yml'
      - 'src/features/odata/**'
      - 'src/test/platform/**'
      - 'src/test/fixtures/platform/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-odata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  odata:
    name: OData на платформе ${{ inputs.platform_version || '8.3.27' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/yellow-hammer/1c-nest/client:${{ inputs.platform_version || '8.3.27' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      PORT: 8314
      IBCMD: /opt/1cv8/current/ibcmd
      IBSRV: /opt/1cv8/current/ibsrv
      V8_DESIGNER: /opt/1cv8/current/1cv8
      V8_THIN: /opt/1cv8/current/1cv8c

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Собрать расширение
        run: |
          npm ci
          npm run compile

      - name: Подготовить конфигурацию, исходники обработки и конфиг публикации
        run: |
          WORK=$(mktemp -d); chmod 777 "$WORK"
          mkdir -p "$WORK/db" "$WORK/data"
          {
            echo "WORK=$WORK"
            echo "DB_DIR=$WORK/db"
            echo "DATA_DIR=$WORK/data"
          } >> "$GITHUB_ENV"
          node out/test/platform/prepareOData.node.js "$WORK/cf" "$WORK/epf-src" \
            "$WORK/publication.yaml" "$WORK/db" "$PORT"

      - name: Создать базу из конфигурации
        run: |
          DATA_ARG=""
          if ! timeout 300 "$IBCMD" infobase create --db-path="$DB_DIR"; then
            DATA_ARG="--data=$DATA_DIR"
            timeout 300 "$IBCMD" infobase create $DATA_ARG --db-path="$DB_DIR"
          fi
          timeout 300 "$IBCMD" infobase config import $DATA_ARG --db-path="$DB_DIR" "$WORK/cf"
          timeout 300 "$IBCMD" infobase config apply $DATA_ARG --db-path="$DB_DIR" --force

      - name: Запустить автономный сервер
        run: |
          # Аргументы те же, что у автономного сервера расширения: данные и конфиг публикации
          "$IBSRV" --data="$DATA_DIR" --config="$WORK/publication.yaml" > "$WORK/ibsrv.log" 2>&1 &
          echo $! > "$WORK/ibsrv.pid"
          for i in $(seq 1 30); do
            curl -s "http://localhost:$PORT/" > /dev/null 2>&1 && break
            sleep 2
          done
          echo "ONEC_PUBLICATION_URL=http://localhost:$PORT/ib" >> "$GITHUB_ENV"
          curl -s -o /dev/null -w '$metadata: %{http_code}\n' "http://localhost:$PORT/ib/odata/standard.odata/\$metadata" || true

      - name: Проверить запросы и состав OData
        # Файл идёт в том же процессе: у Node 20 обмен с дочерним процессом тестов ломается на выводе
        run: node --test-reporter=spec out/test/platform/odataPlatform.node.js

      - name: Методы изменения, которые принимает сервер (при неудаче проверки)
        if: failure()
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
          ROOT="$ONEC_PUBLICATION_URL/odata/standard.odata"
          SET=$(python3 -c "import urllib.parse;print(urllib.parse.quote('Catalog_Товары'))")
          curl -s -X POST "$ONEC_PUBLICATION_URL/hs/odata-composition/run" \
            -d '{"include":[{"name":"Catalog_Товары","candidates":["Справочник.Товары"]}],"exclude":[],"available":false}' > /dev/null
          new_key() {
            curl -s -X POST -H 'Content-Type: application/json' -d '{"Description":"Диагностика"}' "$ROOT/$SET?\$format=json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('Ref_Key',''))"
          }
          try() {
            local title="$1"; shift
            local key; key=$(new_key)
            local element="$ROOT/$SET(guid'$key')?\$format=json"
            local code
            code=$(curl -s -o /tmp/answer.txt -w '%{http_code}' --max-time 10 "$@" "$element" || true)
            local now
            now=$(curl -s --max-time 10 "$element" | python3 -c "import json,sys;print(json.load(sys.stdin).get('Description','(нет)'))" 2>/dev/null || echo '(не прочитан)')
            echo "$title → HTTP $code, наименование после: $now; тело: $(head -c 200 /tmp/answer.txt)"
          }
          BODY='{"Description":"Изменено"}'
          try "PATCH" -X PATCH -H 'Content-Type: application/json' -d "$BODY"
          try "MERGE" -X MERGE -H 'Content-Type: application/json' -d "$BODY"
          try "PUT" -X PUT -H 'Content-Type: application/json' -d "$BODY"
          try "POST + X-HTTP-Method: PATCH" -X POST -H 'X-HTTP-Method: PATCH' -H 'Content-Type: application/json' -d "$BODY"
          try "POST + X-HTTP-Method: MERGE" -X POST -H 'X-HTTP-Method: MERGE' -H 'Content-Type: application/json' -d "$BODY"
          try "DELETE" -X DELETE
          echo "=== Заголовки успешного GET"
          curl -s -D - -o /dev/null --max-time 10 "$ROOT/$SET?\$format=json&\$top=1" || true

      - name: Собрать служебную обработку конфигуратором (пробно)
        id: designer
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -z "$V8_DESIGNER" ]; then echo "Конфигуратор не установлен"; exit 1; fi
          # Отдельная пустая база: рабочую держит ibsrv
          BUILD_DB="$WORK/build-db"; mkdir -p "$BUILD_DB"
          timeout 300 "$IBCMD" infobase create --db-path="$BUILD_DB" || true
          set +e
          timeout 300 xvfb-run -a "$V8_DESIGNER" DESIGNER /F"$BUILD_DB" \
            /DisableStartupDialogs /DisableStartupMessages /Out "$WORK/designer.log" \
            /LoadExternalDataProcessorOrReportFromFiles "$WORK/epf-src/ODataComposition.xml" "$WORK/ODataComposition.epf"
          CODE=$?
          set -e
          echo "Код возврата конфигуратора: $CODE"
          iconv -f cp1251 -t utf-8 "$WORK/designer.log" 2>/dev/null || cat "$WORK/designer.log" 2>/dev/null || true
          test -f "$WORK/ODataComposition.epf"

      - name: Запустить служебную обработку тонким клиентом (пробно)
        id: thin
        if: ${{ !cancelled() && steps.designer.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -z "$V8_THIN" ]; then echo "Тонкий клиент не установлен"; exit 1; fi
          EXCHANGE="$WORK/exchange"; mkdir -p "$EXCHANGE"
          echo '{"include":[{"name":"Catalog_Товары","candidates":["Справочник.Товары","Catalog.Товары"]}],"exclude":[],"available":false}' > "$EXCHANGE/request.json"
          set +e
          timeout 180 xvfb-run -a "$V8_THIN" ENTERPRISE /WS"$ONEC_PUBLICATION_URL" \
            /DisableStartupDialogs /DisableStartupMessages /Out "$WORK/client.log" \
            /Execute "$WORK/ODataComposition.epf" /C"$EXCHANGE"
          echo "Код возврата тонкого клиента: $?"
          set -e
          cat "$WORK/client.log" 2>/dev/null || true
          echo "Ответ обработки:"
          cat "$EXCHANGE/response.json"

      - name: Итог
        if: always()
        run: |
          {
            echo "### OData на платформе $ONEC_VERSION"
            echo ""
            echo "| Шаг | Итог |"
            echo "|---|---|"
            echo "| Сборка обработки конфигуратором (пробно) | ${{ steps.designer.outcome }} |"
            echo "| Запуск обработки тонким клиентом (пробно) | ${{ steps.thin.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Журнал автономного сервера
        if: always()
        run: |
          [ -f "$WORK/ibsrv.pid" ] && kill "$(cat "$WORK/ibsrv.pid")" 2>/dev/null || true
          cat "$WORK/ibsrv.log" 2>/dev/null || true
